[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-orchestration"
dynamic = ["version"]
description = "Human-in-the-loop LangGraph agent with pluggable task execution and hybrid retrieval"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Habib Zouari" }]
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.4,<6",
    "fastapi>=0.115,<1",
    "fastembed>=0.5,<1",
    "langchain-core>=0.3,<2",
    "langchain-openai>=0.3,<2",
    "langgraph>=0.2,<2",
    "langgraph-checkpoint-redis>=0.1,<1",
    "numpy>=1.26",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.6,<3",
    "redis>=5,<7",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.8"]

[tool.setuptools.dynamic]
version = { attr = "agent_orchestration.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = ["integration: needs live Redis/PostgreSQL services (see README)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]
